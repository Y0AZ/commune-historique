<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SEINE SAINT-DENIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous" defer></script>

  <!-- Personnel -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

</head>
<body>

  <h1>Recherche de communes dans le département de la Seine Saint-denis(93)</h1>

  <div class="container mt-4">
    <div class="row">
      <!-- Colonne de gauche : formulaire + résultat -->
      <div class="col-md-4 d-flex flex-column justify-content-start">
        <form onsubmit="event.preventDefault(); chercherCommune();" id="form-recherche" class="mb-3">
          <input type="text" id="commune" placeholder="Nom de la commune" class="form-control mb-2" list="liste-communes" autocomplete="off">
          <datalist id="liste-communes"></datalist>
          <input type="number" id="annee" placeholder="Année" value="2025" class="form-control mb-2">
          <button id="btn-recherche" class="btn btn-primary w-100">VALIDER</button>
        </form>
        <div id="resultat" class="border p-2">
          Vous pouvez commencer votre recherche 🇫🇷.
        </div>
        <div id="evenements" class="mt-3"></div>
      </div>
  
      <!-- Colonne de droite : carte -->
      <div class="col-md-8">
        <div id="map"></div>
      </div>
    </div>
  </div>

</body>
</html>
